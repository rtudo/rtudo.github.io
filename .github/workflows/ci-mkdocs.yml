# .github/workflows/ci-mkdocs.yml
name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main # Deploy when changes are pushed to the 'main' branch

permissions:
  contents: write # Needed to push the generated site to gh-pages branch
  pages: write    # For GitHub Pages deployment
  id-token: write # For OpenID Connect (OIDC) authentication with GitHub Pages

jobs:
  deploy:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: Fetches all history for git-based plugins/features

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Use a recent stable Python version

      - name: Install MkDocs and Material for MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Build MkDocs site
        run: mkdocs build

      - name: Configure Git for deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force # --force ensures it overwrites existing gh-pages branch
